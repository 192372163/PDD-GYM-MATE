name: gymmate_ai
description: "GymMate AI - Virtual Fitness Trainer with Real-Time Exercise Recognition and AI-Powered Personalized Workout & Nutrition Assistant"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.6
  share_plus: ^12.0.2
  url_launcher: ^6.2.0
  path_provider: ^2.1.0

  # Firebase
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  cloud_firestore: ^5.4.4

  # Google Sign-In
  google_sign_in: ^6.2.1

  # State management
  provider: ^6.1.2

  # UI helpers
  fluttertoast: ^8.2.8
  http: ^1.6.0
  fl_chart: ^1.2.0
  camera: ^0.12.0+2
  google_mlkit_pose_detection: ^0.15.0
  flutter_tts: ^4.2.5
  shared_preferences: ^2.5.5
  percent_indicator: ^4.2.5
  pdf: ^3.11.1
  printing: ^5.13.1
  speech_to_text: ^7.4.0
  file_picker: ^11.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
